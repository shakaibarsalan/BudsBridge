[workspace]
resolver = "3"
members = [
    "crates/budsbridge-core",
    "crates/budsbridge-win",
    "apps/desktop/src-tauri",
]
# The desktop app needs a webview toolchain; plain `cargo test` covers the libraries.
default-members = ["crates/budsbridge-core", "crates/budsbridge-win"]

[workspace.package]
version = "0.3.6"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/shakaibarsalan/BudsBridge"

[workspace.dependencies]
budsbridge-core = { path = "crates/budsbridge-core" }
budsbridge-win = { path = "crates/budsbridge-win" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
